<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças e Organizador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="header-main">
        <div class="header-left">
            <div class="app-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>
                </svg>
            </div>
            <div class="header-info">
                <p id="saudacao" class="saudacao"></p>
                <p id="Data"></p>
            </div>
        </div> 
        
        <div class="header-right"></div>
    </header>

    <main>
        <div class="container">
            
            <!-- 1. TELA PRINCIPAL: FINANÇAS -->
            <section id="sec-inicio" class="secao-aba">
                <!-- CARDS RESUMO DO TOPO (3 CARDS) -->
                <div class="tres-colunas">
                    <!-- CARD 1: HOJE -->
                    <div class="card-hoje">
                        <div class="titulo-secao">DISPONÍVEL PARA HOJE</div>
                        <div class="valor-hoje">R$ 0,00</div>
                        <div class="badge-status">🟢 Dentro da meta</div>
                    </div>

                    <!-- CARD 2: MÊS -->
                    <div class="card-mes">
                        <div class="titulo-secao">RESUMO DO MÊS</div>    
                        <div class="info-mes">
                            <span>Gastos / Teto:</span>
                            <span>R$ 0,00</span>
                        </div>
                        <div class="barra-progresso">
                            <div class="progresso-preenchimento"></div>
                        </div>
                    </div>
                
                    <!-- CARD 3: RENDA -->
                    <div class="card-renda">
                        <div class="titulo-secao">RENDA E ECONOMIA</div>
                        <div class="valor-renda">
                            RENDA REGISTRADA:
                            <div class="valor-renda-exibicao" style="font-size: 1.5rem; font-weight: 700; color: #34d399; margin-top: 8px;">R$ 0,00</div>
                        </div>
                    </div>
                </div>

                <!-- ÁREA PRINCIPAL: REGISTRAR GASTO + COLUNA DIREITA (RESTANTE DO MÊS + HISTÓRICO) -->
                <div class="duas-colunas">
                    <!-- LADO ESQUERDO: REGISTRAR NOVO GASTO -->
                    <div class="card-formulario">
                        <div class="titulo-secao">Registrar Novo Gasto</div>
                    
                        <!-- Input de Valor -->
                        <div class="input-container">
                            <span>R$</span>
                            <input type="number" inputmode="decimal" class="input-valor" placeholder="0,00" step="0.5" id="inputValor">
                        </div>

                        <!-- Botões de Categoria -->
                        <div class="cardd">
                            <button class="btn-categoria" style="background-color: var(--cor-fundo-navy);">🍔 Alimentação</button>
                            <button class="btn-categoria" style="background-color: var(--cor-fundo-navy);">🛒 Mercado</button>
                            <button class="btn-categoria" style="background-color: var(--cor-fundo-navy);">🚗 Transporte</button>
                            <button class="btn-categoria" style="background-color: var(--cor-fundo-navy);">🏠 Moradia</button>
                            <button class="btn-categoria" style="background-color: var(--cor-fundo-navy);">🎮 Lazer</button>
                            <button class="btn-categoria" style="background-color: var(--cor-fundo-navy);">💊 Saúde</button>
                            <button class="btn-categoria" style="background-color: var(--cor-fundo-navy);">🛍️ Compras</button>
                            <button class="btn-categoria" style="background-color: var(--cor-fundo-navy);">➕ Outros</button>
                        </div>

                        <!-- Botão de Salvar -->
                        <button class="btn-salvar">Guardar Gasto</button>
                    </div>
                    
                    <!-- LADO DIREITO: RESTANTE DO MÊS + HISTÓRICO ABAIXO -->
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; width: 100%;">
                        <!-- CARD: RESTANTE DO MÊS -->
                        <div class="card-hoje" style="min-height: auto; padding: 18px;">
                            <div class="titulo-secao" style="margin-bottom: 8px;">RESTANTE DO MÊS</div>
                            <div id="elValorSaldoRestanteMes" style="font-size: 1.8rem; font-weight: 800; color: #34D399; margin: 2px 0;">R$ 0,00</div>
                            <div id="elBadgeStatusRestanteMes" class="badge-status">🟢 Restante livre</div>
                        </div>

                        <!-- CARD: HISTÓRICO RECENTE (HOJE) -->
                        <div class="card-historico-sec">
                            <div class="titulo-secao">Histórico Recente (Hoje)</div>
                            <div class="historico-lista"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. TELA TAREFAS -->
            <section id="sec-tarefas" class="secao-aba hidden">
                <div class="card-tarefas-page">
                    <input type="text" class="search-box" id="inputBusca" placeholder="🔍 Buscar por título...">
                    
                    <div class="tabs-status">
                        <button class="tab-btn active">Abertas</button>
                        <button class="tab-btn">Concluídas</button>
                        <button class="tab-btn">Canceladas</button>
                    </div>

                    <div id="listaTarefas"></div>
                </div>
            </section>

            <!-- 3. TELA AGENDA -->
            <section id="sec-agenda" class="secao-aba hidden">
                <div class="card-agenda-page">
                    <div class="agenda-header">
                        <h2>Agenda</h2>
                        <div class="agenda-views">
                            <button class="btn-view" onclick="alterarModoAgenda('dia')">Dia</button>
                            <button class="btn-view active" onclick="alterarModoAgenda('semana')">Semana</button>
                            <button class="btn-view" onclick="alterarModoAgenda('mes')">Mês</button>
                        </div>
                    </div>

                    <div class="agenda-dias" id="agendaDiasHeader"></div>
                    <div class="agenda-timeline" id="agendaGrelha"></div>
                </div>
            </section>

        </div>
    </main>

    <!-- FOOTER COM NAVEGAÇÃO -->
    <footer class="footer-bar">
        <button type="button" class="nav-btn active" id="btnNavInicio">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Início</span>
        </button>

        <button type="button" class="nav-btn" id="btnNavTarefas">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Tarefas</span>
        </button>

        <button type="button" class="btn-add-float" id="btnNavAddAtividade" title="Nova Atividade">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <button type="button" class="nav-btn" id="btnNavAgenda">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Agenda</span>
        </button>

        <button type="button" class="nav-btn" id="btnConfig">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="21" x2="4" y2="14"></line>
                <line x1="4" y1="10" x2="4" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12" y2="3"></line>
                <line x1="20" y1="21" x2="20" y2="16"></line>
                <line x1="20" y1="12" x2="20" y2="3"></line>
                <line x1="1" y1="14" x2="7" y2="14"></line>
                <line x1="9" y1="8" x2="15" y2="8"></line>
                <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
            <span>Ajustes</span>
        </button>
    </footer>

    <!-- MODAL NOVA ATIVIDADE -->
    <div id="modalAtividade" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Nova atividade</h2>
                <button type="button" id="btnFecharModal" class="btn-close">&times;</button>
            </div>

            <form id="formAtividade">
                <div class="tipo-selector">
                    <button type="button" class="btn-tipo active" data-tipo="tarefa">Tarefa</button>
                    <button type="button" class="btn-tipo" data-tipo="compromisso">Compromisso</button>
                </div>

                <div class="form-group">
                    <label for="atividadeTitulo">Título</label>
                    <input type="text" id="atividadeTitulo" placeholder="O que precisa ser feito?" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="atividadeData">Vencimento (opcional)</label>
                        <input type="date" id="atividadeData">
                    </div>
                    <div class="form-group">
                        <label for="atividadeHora">Horário (opcional)</label>
                        <input type="time" id="atividadeHora">
                    </div>
                </div>

                <div class="form-group">
                    <label>Contexto</label>
                    <div class="tags-container">
                        <button type="button" class="tag-chip active" data-val="Empresa">Empresa</button>
                        <button type="button" class="tag-chip" data-val="Faculdade">Faculdade</button>
                        <button type="button" class="tag-chip" data-val="Clientes">Clientes</button>
                        <button type="button" class="tag-chip" data-val="Pessoal">Pessoal</button>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="btnCancelarAtividade" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-principal">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="index.js" defer></script>
</body>
</html>
